spring.application.name=main-backend-service
spring.datasource.url=jdbc:postgresql://localhost:5432/dealership_db?currentSchema=main
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto_namespaces=true
spring.sql.init.mode=always
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.example.mainbackendservice=DEBUG
